[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detectivelab"
version = "0.0.1"
description = "Controlled multimodal evidence-representation experiments"
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
